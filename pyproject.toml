[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2md-local"
version = "0.4.4"
description = "Local PDF to Markdown for maths and science: LaTeX, figures, tables, chapter notes. Optional Obsidian plugin."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = ["pypdf>=6,<7"]

[project.scripts]
pdf2md = "pdf2md_local.convert:main"

[project.urls]
Homepage = "https://github.com/jyothisable/pdf2md-local"

[tool.hatch.build.targets.wheel]
packages = ["pdf2md_local"]
